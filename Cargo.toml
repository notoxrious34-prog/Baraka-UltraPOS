[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/commands",
  "crates/spooler_raw",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
authors = ["Baraka Architecture Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
# TASK-BRK-055 scoped authorization (Directive #2, Part 2): enables the
# upstream compile-time hooks module on the pinned dependency for the
# crash driver only; no new crate, no production hook registration.
rusqlite = { version = "0.32", features = ["bundled", "backup", "modern_sqlite", "hooks"] }
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0" }
rustybuzz = "0.18"
ab_glyph = "0.2"
ttf-parser = "0.24"
unicode-bidi = "0.3"
image = "0.25"
serialport = "4"
# TASK-BRK-089-C1 authorized (ADR-103): Win32 spooler RAW submit, used ONLY
# by crates/spooler_raw (the single unsafe site). Minimal features.
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Foundation"] }
