# Baraka UltraPOS stable release (Windows NSIS + signed updater artifacts).
#
# Trigger: push a tag `vX.Y.Z` (e.g. `v1.1.0`). The action builds the app,
# signs the updater bundle with TAURI_SIGNING_PRIVATE_KEY, publishes the
# GitHub Release, and attaches `latest.json` consumed by the in-app
# Update Center (Settings → Updates & Maintenance).
#
# Required repository secrets (owner-managed, never committed):
#   TAURI_SIGNING_PRIVATE_KEY            (minisign secret key contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (empty when the key has no password)

name: Stable Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Baraka UltraPOS ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
