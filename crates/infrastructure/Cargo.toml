[package]
name = "baraka-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Baraka UltraPOS infrastructure layer: SQLite persistence and hardware adapters"

[dependencies]
baraka-domain = { path = "../domain" }
baraka-application = { path = "../application" }
rusqlite = { workspace = true, features = ["functions"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
rustybuzz = { workspace = true }
ab_glyph = { workspace = true }
ttf-parser = { workspace = true }
unicode-bidi = { workspace = true }
image = { workspace = true }
serialport = { workspace = true }
# TASK-BRK-089-C1: safe Win32 spooler RAW API (only unsafe site is inside).
spooler-raw = { path = "../spooler_raw" }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "crash_matrix_tests"
path = "tests/crash_matrix_tests.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"
